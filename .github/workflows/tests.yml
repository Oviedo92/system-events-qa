name: Eventia QA & CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: 1. Unit Tests & Coverage (Backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SHADOW_DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma 7 Client
        run: npx prisma generate --config prisma7.config.ts

      - name: Run Jest unit tests with coverage
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: npx jest src/auth/auth.service.spec.ts src/orders/orders.service.spec.ts src/tickets/tickets.service.spec.ts --coverage

      - name: Upload Coverage Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-report
          path: backend/coverage

  api-tests:
    name: 2. API & SLA Tests (Newman)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: template1
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SHADOW_DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      PORT: 3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Backend & Newman dependencies
        run: |
          npm --prefix backend ci
          npm --prefix qa-reports/03-api-tests ci

      - name: Generate Client, Migrate & Seed Database (Prisma 7)
        working-directory: backend
        run: |
          npx prisma generate --config prisma7.config.ts
          npx prisma migrate deploy --config prisma7.config.ts
          npm run db:seed

      - name: Build & Start Backend API (port 3000)
        working-directory: backend
        run: |
          npm run build
          nohup npm run start:prod > backend.log 2>&1 &
          npx wait-on http://localhost:3000/events --timeout 30000

      - name: Run Newman API & SLA Suite (CRUD + Negativos)
        working-directory: qa-reports/03-api-tests
        run: npx newman run eventia-api.postman_collection.json -e eventia-local.postman_environment.json --folder "01 - Auth" --folder "02 - Events & TicketTypes (CRUD Recurso 1)" --folder "03 - Carts (CRUD Recurso 2)" --folder "04 - Negativos (Familia 4xx)" -r cli,htmlextra --reporter-htmlextra-export newman-report/reporte-api-crud-negativos.html

      - name: Run Newman Data-Driven Suite (CSV)
        working-directory: qa-reports/03-api-tests
        run: npm run test:api:ddt

      - name: Upload Newman HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-api-reports
          path: qa-reports/03-api-tests/newman-report

  e2e-and-accessibility:
    name: 3. E2E & WCAG 2.1 AA Accessibility (Playwright)
    runs-on: ubuntu-latest
    needs: api-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: template1
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SHADOW_DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      PORT: 3000
      VITE_API_URL: http://localhost:3000
      VITE_SOCKET_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Backend, Frontend & E2E dependencies
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
          npm --prefix e2e ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Generate Client, Migrate & Seed Database (Prisma 7)
        working-directory: backend
        run: |
          npx prisma generate --config prisma7.config.ts
          npx prisma migrate deploy --config prisma7.config.ts
          npm run db:seed

      - name: Build & Start Backend (3000) and Frontend (5173)
        run: |
          npm --prefix backend run build
          nohup npm --prefix backend run start:prod > backend.log 2>&1 &
          nohup npm --prefix frontend run dev -- --port 5173 --host localhost > frontend.log 2>&1 &
          npx wait-on http://localhost:3000/events http://localhost:5173/login --timeout 45000

      - name: Run Playwright E2E & Axe-Core WCAG 2.1 AA Suite
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright & Accessibility Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-accessibility-report
          path: e2e/playwright-report

